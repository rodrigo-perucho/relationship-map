    <script>
      // Paint the last-used theme colors before the app loads (no flash of the wrong theme).
      // The app writes them in src/themes/apply.ts; this only reads this browser's copy.
      try {
        var boot = JSON.parse(localStorage.getItem('tribis.themeBoot') || 'null')
        if (boot && boot.vars) {
          for (var k in boot.vars) document.documentElement.style.setProperty(k, boot.vars[k])
          document.documentElement.style.colorScheme = boot.scheme || 'light'
          var bg = boot.vars['--c-bg']
          if (bg) document.querySelector('meta[name="theme-color"]').setAttribute('content', bg)
        }
      } catch (e) {}
    </script>
